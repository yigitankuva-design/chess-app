name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --workspace apps/web run lint
      - run: npm --workspace apps/web run test
      - run: npm --workspace apps/web run build

  api:
    name: API (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --cov=chess_api --cov-report=term

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build web app
        run: npm --workspace apps/web run build
      - name: Start web server
        run: |
          npm --workspace apps/web run start &
          echo $! > web.pid
      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Server up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start"
          exit 1
      - name: Install Playwright browsers
        run: npx --workspace e2e playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm --workspace e2e run test
      - name: Stop web server
        if: always()
        run: kill $(cat web.pid) || true
